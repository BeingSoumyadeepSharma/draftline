# Weekly pull requests for dependency updates. Minor and patch updates come
# grouped in one pull request; major updates arrive one by one, since they can
# need code changes (CI runs on each, so failures show before merging).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
